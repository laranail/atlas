# Runs on the runner's own PHP, across the supported floor and ceiling.
#
# Deliberately unlike `laranail/chrono`, which runs everything inside a pinned container because
# every localised zone name it emits comes from ICU and ICU's output moves between releases. This
# package has no such dependency: the dataset is a flat PHP array and the maths is arithmetic, so
# there is nothing for a host to disagree about, and a plain matrix buys back coverage of both
# supported PHP versions instead.
#
# `prefer-lowest` is what catches a constraint looser than the code — it resolves the oldest
# versions the composer.json permits, which is what a consumer on a conservative lockfile gets.

name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependency-versions }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-versions: ['prefer-lowest', 'prefer-stable']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.dependency-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          if [ "${{ matrix.dependency-versions }}" = "prefer-lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Run the suite
        run: composer test

  # The optional-dependency job. rinvex/countries is a `suggest`, and the suite above runs with it
  # installed as a dev dependency — so on its own it never proves the package works without it.
  # This removes it and asserts the shipped dataset still answers everything.
  #
  # The adapter-parity tests skip here rather than fail, which is correct: they compare two sources
  # and one of them is gone.
  without-rinvex:
    name: Without rinvex/countries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install dependencies without the optional data package
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer remove --dev rinvex/countries --no-interaction --no-update
          composer update --prefer-stable --no-interaction --no-progress

      - name: Run the suite
        run: composer test

      - name: The shipped dataset still answers on its own
        run: |
          php -r '
            require "vendor/autoload.php";
            $r = new Simtabi\Laranail\Atlas\Adapters\Generated\GeneratedPlaceRepository(__DIR__."/resources/data");
            if (! $r->isAvailable() || count($r->all()) < 200 || $r->find("KE")?->name !== "Kenya") {
                fwrite(STDERR, "the generated adapter cannot stand alone\n");
                exit(1);
            }
            echo count($r->all()), " countries, no data package.\n";
          '

  # The optional-dependency job, the other way round. laranail/chrono is a
  # `suggest` — its PHP floor is ^8.5 and this package supports ^8.4.1, so it
  # cannot be a dev dependency without breaking the 8.4 leg above. The suite
  # therefore never exercises the bridge's present-path unless a job installs it.
  #
  # 8.5 only, for that floor.
  with-chrono:
    name: With laranail/chrono
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl, calendar
          coverage: none

      - name: Install with the optional bridge dependency
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer config repositories.chrono vcs https://github.com/laranail/chrono
          composer require --dev laranail/chrono:^0.1 --no-interaction --no-progress

      - name: Run the suite
        run: composer test

      - name: The bridge actually answers
        run: |
          php -r '
            require "vendor/autoload.php";
            if (! class_exists("Simtabi\\Laranail\\Chrono\\Facades\\Timezones")) {
                fwrite(STDERR, "chrono did not install; the bridge tests would have skipped silently.\n");
                exit(1);
            }
            echo "chrono present — the bridge present-path ran.\n";
          '
